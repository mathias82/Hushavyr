rules:
  - id: hushavyr.javascript-insecure-tls
    languages: [javascript, typescript]
    severity: WARNING
    message: TLS certificate verification is disabled
    pattern: 'rejectUnauthorized: false'
  - id: hushavyr.python-shell-execution
    languages: [python]
    severity: WARNING
    message: Shell execution requires review for untrusted input
    pattern: subprocess.run(..., shell=True, ...)
  - id: hushavyr.java-deserialization
    languages: [java]
    severity: WARNING
    message: ObjectInputStream deserialization requires an allowlist filter
    pattern: new ObjectInputStream(...)

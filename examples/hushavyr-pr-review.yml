# Copy to .github/workflows/ in your repo.
# Runs on a self-hosted runner that has Ollama (and optionally semgrep) installed,
# so the code is reviewed by a local model and never leaves your machine.
name: Hushavyr PR review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mathias82/Hushavyr
          path: .hushavyr-tool
      - name: Build Hushavyr
        run: cd .hushavyr-tool && npm ci --ignore-scripts && npm run build
      - name: Local review of the changed lines
        run: node .hushavyr-tool/dist/prReview.js . --base "origin/${{ github.base_ref }}" --markdown hushavyr-comment.md --fail-on high
      - name: Comment on the PR
        if: always() && hashFiles('hushavyr-comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file hushavyr-comment.md --edit-last || gh pr comment "${{ github.event.pull_request.number }}" --body-file hushavyr-comment.md

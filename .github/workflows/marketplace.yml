name: Package and publish Hushavyr

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/marketplace.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish Hushavyr to VS Code Marketplace using Trusted Publishing (requires Marketplace policy)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Build and verify VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify extension identity
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          if (p.publisher !== 'mathias82' || p.name !== 'hushavyr' || !/^\d+\.\d+\.\d+$/.test(p.version)) {
            throw new Error('Refusing to build unexpected publisher, name, or version');
          }
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Package Marketplace VSIX
        run: npm run package:vsix -- --out hushavyr.vsix
      - name: Verify packaged manifest
        run: |
          unzip -p hushavyr.vsix extension/package.json > packaged-manifest.json
          node - <<'NODE'
          const p = require('./packaged-manifest.json');
          const source = require('./package.json');
          if (p.publisher !== source.publisher || p.name !== source.name || p.version !== source.version) {
            throw new Error('Packaged extension identity differs from expected');
          }
          NODE
      - name: Upload installable VSIX
        uses: actions/upload-artifact@v4
        with:
          name: hushavyr-vsix
          path: hushavyr.vsix
          if-no-files-found: error

  publish:
    name: Publish using Marketplace Trusted Publishing
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hushavyr-vsix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install VSCE with OIDC support
        run: npm install --global @vscode/vsce@4.1.0
      - name: Publish verified package
        run: vsce publish --oidc --packagePath hushavyr.vsix
      - name: Publish to Open VSX (Cursor, VSCodium, Windsurf)
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1.4.0 publish hushavyr.vsix --pat "$OVSX_PAT"

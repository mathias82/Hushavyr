name: Polyglot benchmark evaluator
on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/polyglot-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/polyglot-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate multilingual benchmark evaluator
        run: node --test benchmarks/evaluate.test.mjs

name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile TypeScript
        run: npm run build
      - name: Run regression tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install --quiet semgrep
      - name: Static review gate (rule pack on benchmark fixtures)
        run: node dist/benchmark.js --static --gate
      - name: CLI smoke test (SARIF export)
        run: |
          node dist/cli.js . --sarif hushavyr.sarif --fail-on none
          node -e "const s=JSON.parse(require('fs').readFileSync('hushavyr.sarif','utf8'));if(s.version!=='2.1.0'||!Array.isArray(s.runs[0].results))process.exit(1)"

      - name: Build Python proof fixture image
        run: |
          docker build -t hushavyr-pytest:local - <<'DOCKERFILE'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir pytest==8.3.5
          DOCKERFILE
      - name: Run Python proof in the offline container
        env:
          HUSHAVYR_PYTHON_DOCKER_SMOKE: '1'
        run: node --test dist/test/fix-python.test.js
      - name: Build TypeScript proof fixture image
        run: |
          docker pull node:24-slim
          docker build -t hushavyr-typescript:local - <<'DOCKERFILE'
          FROM node:24-slim
          RUN npm install --global --ignore-scripts typescript@5.9.3
          DOCKERFILE
      - name: Run JavaScript and TypeScript proofs offline
        env:
          HUSHAVYR_NODE_DOCKER_SMOKE: '1'
        run: node --test dist/test/fix-node.test.js

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run end-to-end tests in VS Code
        run: xvfb-run -a npm run test:e2e

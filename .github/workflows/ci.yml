name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile TypeScript
        run: npm run build
      - name: Run regression tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install --quiet semgrep
      - name: Static review gate (rule pack on benchmark fixtures)
        run: node dist/benchmark.js --static --gate
      - name: CLI smoke test (SARIF export)
        run: |
          node dist/cli.js . --sarif hushavyr.sarif --fail-on none
          node -e "const s=JSON.parse(require('fs').readFileSync('hushavyr.sarif','utf8'));if(s.version!=='2.1.0'||!Array.isArray(s.runs[0].results))process.exit(1)"

      - name: Build Python proof fixture image
        run: |
          docker build -t hushavyr-pytest:local - <<'DOCKERFILE'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir pytest==8.3.5
          DOCKERFILE
      - name: Run Python proof in the offline container
        env:
          HUSHAVYR_PYTHON_DOCKER_SMOKE: '1'
        run: node --test dist/test/fix-python.test.js
      - name: Build TypeScript proof fixture image
        run: |
          docker pull node:24-slim
          docker build -t hushavyr-typescript:local - <<'DOCKERFILE'
          FROM node:24-slim
          RUN npm install --global --ignore-scripts typescript@5.9.3
          DOCKERFILE
      - name: Run JavaScript and TypeScript proofs offline
        env:
          HUSHAVYR_NODE_DOCKER_SMOKE: '1'
        run: node --test dist/test/fix-node.test.js

  terminal:
    # The hushavyr launcher scripts (sh and cmd) on every desktop OS, as shipped in the VSIX.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Fixture with a hardcoded password
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/hv" && printf 'const password = "Sup3rS3cretPassw0rd!";\n' > "$RUNNER_TEMP/hv/app.js"
      - name: hushavyr (sh)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/hv
        env:
          HUSHAVYR_OLLAMA_ENDPOINT: http://127.0.0.1:9
        run: |
          sh "$GITHUB_WORKSPACE/bin/hushavyr" --version
          sh "$GITHUB_WORKSPACE/bin/hushavyr" /secrets | tee out.txt
          grep -q "app.js:1  Potential hardcoded credential" out.txt
      - name: hushavyr (cmd)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ${{ runner.temp }}/hv
        env:
          HUSHAVYR_OLLAMA_ENDPOINT: http://127.0.0.1:9
        run: |
          call "%GITHUB_WORKSPACE%\bin\hushavyr.cmd" --version || exit /b 1
          call "%GITHUB_WORKSPACE%\bin\hushavyr.cmd" /secrets > out.txt || exit /b 1
          type out.txt
          findstr /C:"app.js:1  Potential hardcoded credential" out.txt || exit /b 1

  benchmark-gate:
    # Fails when a known finding on the pinned OWASP Benchmarks or the six real vulnerable apps is lost, or a new one appears.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hushavyr
            ~/.cache/hushavyr-bench
          key: benchmark-sources-${{ hashFiles('benchmarks/realworld.mjs') }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # The cookie and part of the hash results come from the bundled Semgrep rule pack.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install --quiet semgrep==1.186.0
      - name: OWASP Benchmark for Java (97.2%, 0% false positives)
        run: node benchmarks/owasp.mjs --min-score 97.2 --max-fpr 0
      - name: OWASP Benchmark for Python (100%, 0% false positives)
        run: node benchmarks/owasp.mjs --lang python --min-score 100 --max-fpr 0
      - name: Real-world apps (Juice Shop, WebGoat, DVWA, RailsGoat, GoVWA, WebGoat.NET)
        run: node benchmarks/realworld.mjs

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run end-to-end tests in VS Code
        run: xvfb-run -a npm run test:e2e
